<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060b">
<meta property="og:title" content="Darujhistan Flyover">
<meta property="og:description" content="A fan-made 3D night flyover of Darujhistan, the City of Blue Fire.">
<title>Darujhistan Flyover</title>
<meta name="description" content="A fan-made 3D night flyover of Darujhistan, the City of Blue Fire.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04060b;
    --ink: #e6eefc;
    --ink-2: #a9b9d6;
    --ink-3: #7487a8;
    --fire: #7fc4ff;
    --fire-2: #3d8fe6;
    --glass: rgba(10, 16, 30, 0.62);
    --glass-2: rgba(16, 26, 46, 0.78);
    --line: rgba(127, 196, 255, 0.22);
    --amber: #f2c27a;
    --serif: 'IM Fell English SC', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --sans: 'Alegreya Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  .ui { position: fixed; inset: 0; pointer-events: none; }
  .ui > * { pointer-events: auto; }

  /* title */
  #brand {
    position: absolute; top: max(14px, env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    opacity: 0; transition: opacity 1.2s ease; pointer-events: none;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.8);
  }
  #brand.on { opacity: 1; }
  #brand b { display: block; font-family: var(--serif); font-weight: 400; font-size: 22px; letter-spacing: 0.04em; color: var(--ink); }
  #brand span { display: block; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fire); margin-top: 1px; }

  #intro {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    pointer-events: none; padding: 0 16px; transition: opacity 1.6s ease;
    background: radial-gradient(ellipse at 50% 45%, rgba(4, 6, 11, 0.55), rgba(4, 6, 11, 0) 70%);
  }
  #intro.gone { opacity: 0; }
  #intro h1 {
    margin: 0; font-family: var(--serif); font-weight: 400; color: var(--ink);
    font-size: clamp(40px, 11vw, 96px); letter-spacing: 0.03em; line-height: 1;
    text-shadow: 0 0 28px rgba(80, 160, 255, 0.55), 0 2px 18px rgba(0, 0, 0, 0.9);
  }
  #intro p {
    margin: 12px 0 0; font-size: clamp(13px, 3.4vw, 18px); letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--fire); text-shadow: 0 0 16px rgba(60, 150, 255, 0.7);
  }

  /* landmark labels */
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl {
    position: absolute; left: 0; top: 0; transform: translate3d(-9999px, 0, 0);
    display: flex; flex-direction: column; align-items: center; pointer-events: none;
    will-change: transform, opacity; opacity: 0; transition: opacity 0.35s ease;
  }
  .lbl button {
    pointer-events: auto; cursor: pointer; border: 1px solid var(--line); background: var(--glass);
    color: var(--ink); font: 500 12.5px/1 var(--sans); letter-spacing: 0.02em; white-space: nowrap;
    padding: 6px 9px 6px; border-radius: 999px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .lbl button:hover { border-color: var(--fire); }
  .lbl i { width: 1px; height: 18px; background: linear-gradient(var(--line), rgba(127, 196, 255, 0.0)); }
  .lbl.spawn button { color: #cfd8ff; }
  #labels.off .lbl { opacity: 0 !important; }
  #labels.off .lbl button { pointer-events: none; }

  /* caption */
  #caption {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 92px);
    width: min(560px, calc(100% - 32px)); text-align: center; pointer-events: none;
    transition: opacity 0.7s ease; text-shadow: 0 1px 14px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0, 0, 0, 0.8);
  }
  #caption.hide { opacity: 0; }
  #caption h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 24px; color: var(--ink); letter-spacing: 0.02em; }
  #caption p { margin: 4px 0 0; font-size: 15px; line-height: 1.35; color: var(--ink-2); }

  /* controls */
  #bar {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(max(12px, env(safe-area-inset-bottom, 0px)) + 24px);
    display: flex; gap: 8px; padding: 6px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    max-width: calc(100% - 32px);
  }
  #bar button {
    appearance: none; border: 0; cursor: pointer; border-radius: 999px; padding: 10px 14px; min-height: 40px;
    font: 500 14px/1 var(--sans); color: var(--ink); background: transparent; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 7px;
  }
  #bar button:hover { background: rgba(127, 196, 255, 0.1); }
  #bar button:focus-visible, .lbl button:focus-visible { outline: 2px solid var(--fire); outline-offset: 2px; }
  #bar button.main { background: linear-gradient(180deg, #2f7fd6, #1d5ea8); color: #fff; box-shadow: 0 0 18px rgba(60, 150, 255, 0.35); }
  #bar button.main:hover { background: linear-gradient(180deg, #3a8be2, #2367b4); }
  #bar button[aria-pressed="false"] { color: var(--ink-3); }
  #bar svg { width: 16px; height: 16px; flex: none; }

  #credits {
    position: absolute; left: 0; right: 0; bottom: max(6px, env(safe-area-inset-bottom, 0px));
    text-align: center; font-size: 11px; color: var(--ink-3); pointer-events: none; padding: 0 16px;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  #hint {
    position: absolute; top: calc(max(14px, env(safe-area-inset-top, 0px)) + 56px); left: 50%;
    transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; font-size: 13px; color: var(--ink-2);
    background: var(--glass-2); border: 1px solid var(--line); opacity: 0; transition: opacity 0.5s ease;
    pointer-events: none; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
  }
  #hint.on { opacity: 1; }

  #loader {
    position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 5;
    transition: opacity 1.1s ease; text-align: center; padding: 0 16px;
  }
  #loader.gone { opacity: 0; pointer-events: none; }
  #loader .flame {
    width: 14px; height: 14px; margin: 0 auto 16px; border-radius: 50%;
    background: radial-gradient(circle, #dff1ff 0 25%, #5fb0ff 45%, rgba(40, 120, 255, 0) 70%);
    box-shadow: 0 0 22px 6px rgba(70, 150, 255, 0.55); animation: flick 1.4s ease-in-out infinite;
  }
  #loader p { margin: 0; font-family: var(--serif); font-size: 18px; color: var(--ink-2); letter-spacing: 0.04em; }
  #loader small { display: block; margin-top: 8px; font-size: 13px; color: var(--ink-3); }
  @keyframes flick { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.82); opacity: 0.75; } }

  @media (max-width: 520px) {
    #bar { gap: 2px; }
    #bar button { padding: 10px 11px; font-size: 13.5px; }
    #caption h2 { font-size: 21px; }
    #caption p { font-size: 14px; }
    #brand b { font-size: 19px; }
  }
  @media (max-width: 360px) {
    #bar .t-opt { display: none; }
  }
  @media (max-height: 460px) and (orientation: landscape) {
    #caption { bottom: calc(max(8px, env(safe-area-inset-bottom, 0px)) + 78px); }
    #caption p { display: none; }
    #bar { bottom: calc(max(8px, env(safe-area-inset-bottom, 0px)) + 18px); }
  }
  @media (prefers-reduced-motion: reduce) {
    #intro, #brand, #caption, .lbl, #loader, #hint { transition: none; }
    #loader .flame { animation: none; }
  }
</style>
</head>
<body>
<div id="stage" aria-label="3D view of Darujhistan at night"></div>

<div class="ui">
  <div id="intro" aria-hidden="true"><div><h1>Darujhistan</h1><p>City of Blue Fire</p></div></div>
  <div id="brand"><b>Darujhistan</b><span>City of Blue Fire</span></div>
  <div id="labels"></div>
  <div id="hint" role="status" aria-live="polite"></div>
  <div id="caption" class="hide" aria-live="polite"><h2></h2><p></p></div>
  <div id="bar" role="toolbar" aria-label="Flyover controls">
    <button id="bMode" class="main" type="button"></button>
    <button id="bLabels" type="button" aria-pressed="true">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v6h-6l-3 3v-3h-2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>Labels</button>
    <button id="bSpawn" type="button" aria-pressed="true">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5.5h12L8.6 13.5h-1.2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5 5.5V3M8 5.5V2M11 5.5V3.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span><span class="t-opt">Moon's&nbsp;</span>Spawn</span></button>
  </div>
  <div id="credits">The world of Malazan was created by Steven Erikson and Ian C. Esslemont &middot; fan-made flyover</div>
</div>

<div id="loader" role="status"><div><div class="flame"></div><p>Lighting the gas&hellip;</p><small>Building the city</small></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// Darujhistan, City of Blue Fire: procedural scene (no DOM; runs in the page and in node tests)
function buildWorld(THREE, opts = {}) {
  const rnd = mulberry32(opts.seed || 20261124);
  const rand = (a = 0, b = 1) => a + (b - a) * rnd();
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  const sstep = (a, b, x) => { let t = (x - a) / (b - a); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); };
  const TAU = Math.PI * 2;

  // ---------- geography ----------
  // Lake Azur lies north (negative z). The city rises in four tiers eastward,
  // ringed around Majesty Hill in the upper city.
  const C0x = 170, C0z = 90;              // Majesty Hill, centre of the tiers
  const T_UP = 114, T_DARU = 194, T_LAKE = 269; // tier boundaries (distance from Majesty Hill)
  const EL = { x: 0, z: 0, rx: 330, rz: 260 };   // outer city wall (ellipse)
  const H_BASE = 3, H_LAKE = 8, H_DARU = 9, H_UP = 10, H_HILL = 13;

  function shoreZ(x) {
    return -110 - 0.25 * Math.max(0, x) + 6 * Math.sin(x * 0.021) + 3 * Math.sin(x * 0.057 + 1.3)
      + 48 * Math.exp(-Math.pow((x + 205) / 48, 2));
  }
  const ell = (x, z) => Math.sqrt(Math.pow((x - EL.x) / EL.rx, 2) + Math.pow((z - EL.z) / EL.rz, 2));
  const dHill = (x, z) => Math.hypot(x - C0x, z - C0z);

  function hash2(i, j) { const h = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return h - Math.floor(h); }
  function vnoise(x, z) {
    const i = Math.floor(x), j = Math.floor(z), fx = x - i, fz = z - j;
    const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
    const a = hash2(i, j), b = hash2(i + 1, j), c = hash2(i, j + 1), d = hash2(i + 1, j + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  }
  const fbm = (x, z) => vnoise(x, z) * 0.5 + vnoise(x * 2.03 + 5.2, z * 2.03 + 1.3) * 0.25 + vnoise(x * 4.1 + 9.1, z * 4.1 + 3.7) * 0.125;

  function marshW(x, z) { return Math.exp(-(Math.pow((x + 75) / 70, 2) + Math.pow((z + 72) / 42, 2))); }
  function cityH(x, z) {
    const d = dHill(x, z);
    let h = H_BASE;
    const outer = 1 - sstep(T_LAKE + 3, T_LAKE - 3, d);
    h += H_LAKE * sstep(T_LAKE + 3, T_LAKE - 3, d);
    h += H_DARU * sstep(T_DARU + 3, T_DARU - 3, d);
    h += H_UP * sstep(T_UP + 3, T_UP - 3, d);
    h += H_HILL * sstep(48, 30, d);
    h -= marshW(x, z) * outer * (1.6 + 4.2 * (fbm(x * 0.07, z * 0.07) - 0.45));
    return h;
  }
  function ruralH(x, z) {
    let h = 5 + 12 * fbm(x * 0.006, z * 0.006) + 3 * fbm(x * 0.03, z * 0.03);
    h += 72 * Math.exp(-(Math.pow((x - 140) / 230, 2) + Math.pow((z - 600) / 160, 2)));
    h += 58 * Math.exp(-(Math.pow((x + 320) / 190, 2) + Math.pow((z - 620) / 170, 2)));
    h += 64 * Math.exp(-(Math.pow((x - 500) / 160, 2) + Math.pow((z - 460) / 150, 2)));
    return h;
  }
  function landH(x, z) {
    const e = ell(x, z), ch = cityH(x, z);
    if (e <= 1) return ch;
    const w = sstep(0, 80, (e - 1) * 240);
    return ch * (1 - w) + ruralH(x, z) * w;
  }
  function heightAt(x, z) {
    const s = shoreZ(x) - z;
    if (s > 0) return -Math.min(45, 1.5 + s * 1.8);
    return landH(x, z);
  }
  const isLand = (x, z, margin = 0) => z > shoreZ(x) + margin;
  const inCity = (x, z, m = 1) => ell(x, z) < m;
  function district(x, z) {
    const d = dHill(x, z);
    if (d < T_UP) return 'up';
    if (d < T_DARU) return 'daru';
    if (d < T_LAKE) return 'lake';
    return marshW(x, z) > 0.3 ? 'marsh' : 'gadrobi';
  }

  // ---------- shared uniforms & colours ----------
  const U = {
    uTime: { value: 0 },
    uBlue: { value: new THREE.Color(0.30, 0.72, 1.45) },
    uWarm: { value: new THREE.Color(1.0, 0.58, 0.24) },
    uScale: { value: 600 },
    uFogColor: { value: new THREE.Color(0x0b1724) },
    uFogDensity: { value: 0.00105 },
  };
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(U.uFogColor.value.getHex(), U.uFogDensity.value);

  const GLSL_SHORE = `
    float shoreZ(float x){
      return -110.0 - 0.25*max(0.0, x) + 6.0*sin(x*0.021) + 3.0*sin(x*0.057+1.3)
        + 48.0*exp(-((x+205.0)/48.0)*((x+205.0)/48.0));
    }`;
  const GLSL_FOG = `
    float fogF(vec3 wp){ float d = length(cameraPosition - wp); return 1.0 - exp(-uFogDensity*uFogDensity*d*d); }`;

  // ---------- lights ----------
  scene.add(new THREE.HemisphereLight(0x3b5688, 0x0b0d12, 0.75));
  const moon = new THREE.DirectionalLight(0xa8bce0, 1.5);
  moon.position.set(-420, 520, -380);
  scene.add(moon);
  scene.add(new THREE.AmbientLight(0x1a2233, 0.35));

  // ---------- lamp registry (blue gas fire) ----------
  const lamps = []; // {x,y,z,size,c:[r,g,b],ground,glow}
  const BLUE = [0.46, 1.05, 2.1], GREEN = [0.40, 1.60, 1.25], AMBER = [2.0, 1.0, 0.38], PALE = [0.75, 0.85, 1.25];
  function addLamp(x, z, y = null, size = 3.3, col = null, glow = 1) {
    const g = heightAt(x, z);
    const c = col || (rnd() < 0.18 ? GREEN : BLUE);
    const k = 0.8 + rnd() * 0.4;
    lamps.push({ x, y: y == null ? g + 3.4 : y, z, size, c: [c[0] * k, c[1] * k, c[2] * k], ground: g, glow });
  }

  // ---------- avenues and gates ----------
  function validArc(d, test) {
    const ok = [];
    for (let i = 0; i < 720; i++) { const a = (i / 720) * TAU; const x = C0x + Math.cos(a) * d, z = C0z + Math.sin(a) * d; ok.push(test(x, z)); }
    return ok;
  }
  function pickAngles(d, n, test) {
    const ok = validArc(d, test);
    // find the longest contiguous run (with wrap) and space n angles across it
    let start = ok.indexOf(false); if (start < 0) start = 0;
    let best = { s: 0, len: 0 }, cur = null;
    for (let k = 1; k <= 720; k++) {
      const i = (start + k) % 720;
      if (ok[i]) { if (!cur) cur = { s: i, len: 0 }; cur.len++; if (cur.len > best.len) best = { ...cur }; }
      else cur = null;
    }
    if (best.len === 720) best = { s: 0, len: 720 };
    const out = [];
    const full = best.len >= 719;
    for (let k = 0; k < n; k++) {
      const f = full ? k / n : (k + 0.5) / n;
      const idx = (best.s + f * best.len) % 720;
      out.push((idx / 720) * TAU);
    }
    return out;
  }
  const cityTest = (m) => (x, z) => ell(x, z) < m && isLand(x, z, 6);
  const gatesUp = pickAngles(T_UP - 4, 12, cityTest(0.97)).map((a) => a + 0.09);
  const gatesDaru = pickAngles(T_DARU - 4, 12, cityTest(0.96));
  const avenues = [...gatesUp.map((a) => ({ a, from: 52, to: T_DARU - 8 })), ...gatesDaru.map((a) => ({ a, from: T_UP + 8, to: 640 }))];
  const angDiff = (a, b) => { let d = Math.abs(a - b) % TAU; return d > Math.PI ? TAU - d : d; };
  function nearAvenue(x, z, w) {
    const d = dHill(x, z), a = Math.atan2(z - C0z, x - C0x);
    for (const av of avenues) {
      if (d < av.from - 4 || d > av.to + 4) continue;
      if (angDiff(a, av.a) * d < w) return true;
    }
    return false;
  }

  // landmark spots (positions chosen from the books' district placements; exact streets are approximated)
  const LM = {
    harbour: [-205, -80], marsh: [-75, -68], quips: [60, -106], lakefront: [0, -80],
    daru: [40, 125], phoenix: [25, 80], krul: [95, 40], hinter: [236, 40], estates: [222, 160],
    barbican: [117, 93], hall: [C0x, C0z], worry: [392, 8], gadrobi: [-235, 30], hills: [140, 600],
  };
  const reserved = [[...LM.phoenix, 14], [...LM.krul, 16], [...LM.hinter, 10], [...LM.quips, 9], [...LM.barbican, 15]];
  const isReserved = (x, z) => reserved.some(([rx, rz, r]) => Math.hypot(x - rx, z - rz) < r);

  // ---------- instanced building sets ----------
  const sets = {};
  function makeSet(name) { sets[name] = { m: [], c: [], g: [] }; return sets[name]; }
  const S_BLD = makeSet('bld'), S_WALL = makeSet('wall'), S_TOWER = makeSet('tower'), S_HALL = makeSet('hall');
  const roofs = [], domes = [], trees = [], strips = [], piers = [], hulls = [], spires = [];
  const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _e = new THREE.Euler();
  function mat(x, y, z, sx, sy, sz, ry = 0, rx = 0, rz = 0) {
    _e.set(rx, ry, rz); _q.setFromEuler(_e); _p.set(x, y, z); _s.set(sx, sy, sz);
    return _m.clone().compose(_p, _q, _s);
  }
  function addBox(set, x, base, z, w, h, d, ry, color, glow, lit) {
    set.m.push(mat(x, base, z, w, h, d, ry)); set.c.push(color); set.g.push(glow, lit);
  }
  const col = (hex, j = 0.12) => { const c = new THREE.Color(hex); const k = 1 - j / 2 + rnd() * j; return c.multiplyScalar(k); };

  const DIST = {
    up: { fw: [8, 12.5], fd: [8, 12], h: [6, 12], skip: 0.38, lit: 0.42, roof: 0.5, dome: 0.16, col: 0x74767e, roofCol: 0x2f3540 },
    daru: { fw: [6, 8.4], fd: [6, 8], h: [7, 16], skip: 0.06, lit: 0.38, roof: 0.62, dome: 0.03, col: 0x635e58, roofCol: 0x3a2f2c },
    lake: { fw: [6.5, 8.6], fd: [5, 8], h: [4, 9], skip: 0.1, lit: 0.22, roof: 0.55, dome: 0, col: 0x564e47, roofCol: 0x2c2724 },
    gadrobi: { fw: [3.6, 4.5], fd: [4, 7], h: [3, 6], skip: 0.08, lit: 0.26, roof: 0.7, dome: 0, col: 0x4b433d, roofCol: 0x2a2320 },
    marsh: { fw: [3, 4.4], fd: [3, 5], h: [2.5, 4], skip: 0.5, lit: 0.18, roof: 0.8, dome: 0, col: 0x48443b, roofCol: 0x221f1a },
  };
  const LAMP_P = { up: 0.42, daru: 0.5, lake: 0.36, gadrobi: 0.12, marsh: 0.06 };

  const distCount = {};

    roofs.push({ x: bx, y: kg + 35, z: bz, w: 7.4, d: 7.4, h: 9, ry: 0.5, c: new THREE.Color(0x22262c) });

  // ---------- trees outside the walls & estate gardens ----------
  for (let i = 0; i < 520; i++) {
    const x = rand(-900, 900), z = rand(-300, 880);
    if (inCity(x, z, 1.06) || !isLand(x, z, 10)) continue;

  // =====================================================================
  // MESHES
  // =====================================================================
  function makeLitMaterial(win) {
    const m = new THREE.MeshLambertMaterial({ color: 0xffffff });
    m.onBeforeCompile = (sh) => {
      sh.uniforms.uTime = U.uTime; sh.uniforms.uBlue = U.uBlue; sh.uniforms.uWarm = U.uWarm;
      sh.uniforms.uWin = { value: win };

        .replace('#include <common>', `#include <common>

        .replace('#include <fog_vertex>', `#include <fog_vertex>
          vec4 bwp = vec4(transformed, 1.0);
          vec3 bn = objectNormal;
          #ifdef USE_INSTANCING

            vec2 sd = cell + vBase.xz * 0.173 + n.xz * 3.1;

            float lit = step(1.0 - vGlow.y, r) * win * wall * uWin;

  // ---------- ground glow map (gas light pooling on the streets) ----------
  const TX0 = -1000, TX1 = 1000, TZ0 = -470, TZ1 = 900;

  const K1 = kern(3, 1.0), K2 = kern(13, 0.05);

    };

    const body = new THREE.Mesh(g, basalt); body.scale.set(150, 125, 150); spawn.add(body);
    const sg2 = new THREE.ConeGeometry(1, 1, 5, 1); sg2.translate(0, 0.5, 0);
    const spn = new THREE.InstancedMesh(sg2, basalt, 22);
    const r3 = mulberry32(5);
    for (let i = 0; i < 22; i++) {
      const a = r3() * TAU, r = Math.sqrt(r3()) * 120, h = 20 + r3() * 70 * (1 - r / 160);

    }

    const lp = [], lc = [], ls = [], lph = [];
    for (let i = 0; i < 70; i++) {
      const a = r3() * TAU, yy = r3();
      const ly = 62 - yy * 112;
      const rr = 150 * ((ly + 62.5) / 125) * 1.04;
      lp.push(Math.cos(a) * rr, ly, Math.sin(a) * rr);

  // LANDMARKS AND THE TOUR
  // =====================================================================
  const gy = (x, z, o = 0) => Math.max(heightAt(x, z), 0) + o;

    { id: 'lake', name: 'Lake Azur', pos: [-170, 14, -420], far: 2000 },
    { id: 'harbour', name: 'Gadrobi harbour', pos: [LM.harbour[0], 10, LM.harbour[1]], far: 700 },
    { id: 'gadrobi', name: 'Gadrobi District', pos: [LM.gadrobi[0], gy(...LM.gadrobi, 22), LM.gadrobi[1]], far: 900 },
    { id: 'marsh', name: 'Marsh District', pos: [LM.marsh[0], gy(...LM.marsh, 14), LM.marsh[1]], far: 600 },
    { id: 'lakefront', name: 'Lakefront District', pos: [LM.lakefront[0], gy(...LM.lakefront, 22), LM.lakefront[1]], far: 800 },
    { id: 'quips', name: "Quip's Bar", pos: [LM.quips[0], gy(...LM.quips, 10), LM.quips[1]], far: 240 },
    { id: 'daru', name: 'Daru District', pos: [LM.daru[0], gy(...LM.daru, 24), LM.daru[1]], far: 900 },
    { id: 'phoenix', name: 'Phoenix Inn', pos: [LM.phoenix[0], gy(...LM.phoenix, 18), LM.phoenix[1]], far: 280 },
    { id: 'krul', name: "K'rul's belfry", pos: [S_HALL.krulTop[0], S_HALL.krulTop[1] + 4, S_HALL.krulTop[2]], far: 420 },
    { id: 'hinter', name: "Hinter's Tower", pos: [LM.hinter[0] + 2, S_HALL.hinter[1] + 52, LM.hinter[1]], far: 420 },
    { id: 'estates', name: 'Estate District', pos: [LM.estates[0], gy(...LM.estates, 26), LM.estates[1]], far: 900 },
    { id: 'hill', name: 'Majesty Hill', pos: [C0x - 30, hillTop - 2, C0z + 36], far: 700 },
    { id: 'hall', name: 'Majesty Hall', pos: [C0x, hillTop + 36, C0z], far: 900 },
    { id: 'barbican', name: "Despot's Barbican", pos: [LM.barbican[0], gy(...LM.barbican, 32), LM.barbican[1]], far: 360 },
    { id: 'worry', name: 'Worrytown', pos: [LM.worry[0] + 30, gy(LM.worry[0] + 30, LM.worry[1], 14), LM.worry[1]], far: 600 },
    { id: 'hills', name: 'Gadrobi Hills', pos: [LM.hills[0], gy(...LM.hills, 40), LM.hills[1]], far: 2000 },
    { id: 'spawn', name: "Moon's Spawn", pos: [spawn.position.x, spawn.position.y + 90, spawn.position.z], far: 3000, spawn: true },
  ];

  const K = (p, t, cap) => ({ p: new THREE.Vector3(...p), t: new THREE.Vector3(...t), cap });
  const keys = [
    K([-360, 30, -430], [-40, 16, -30], 'lake'),
    K([-300, 24, -250], [-205, 10, -60], 'harbour'),
    K([-140, 18, -185], [-70, 6, -60], 'marsh'),
    K([10, 22, -205], [60, 12, -100], 'lakefront'),
    K([12, 62, -100], [30, 24, 70], 'daru'),
    K([-30, 62, 140], [25, 20, 80], 'phoenix'),
    K([20, 78, 30], [S_HALL.krulTop[0], S_HALL.krulTop[1] - 14, S_HALL.krulTop[2]], 'krul'),
    K([60, 74, 158], [LM.barbican[0], gy(...LM.barbican, 12), LM.barbican[1]], 'barbican'),
    K([160, 84, 205], [C0x, hillTop + 14, C0z], 'hill'),
    K([275, 86, 118], [C0x, hillTop + 14, C0z], 'hall'),
    K([282, 88, -34], [LM.hinter[0], S_HALL.hinter[1] + 24, LM.hinter[1]], 'hinter'),
    K([150, 92, -48], [C0x + 20, hillTop, C0z + 60], 'estates'),
    K([430, 64, -48], [350, 26, 8], 'worry'),
    K([150, 150, 430], [90, 20, 20], 'hills'),
    K([-180, 150, -250], [150, 215, 190], 'spawn'),
    K([250, 170, -400], [80, 50, 100], 'city'),
    K([-120, 100, -560], [20, 30, 40], 'overview'),
  ];
  const posCurve = new THREE.CatmullRomCurve3(keys.map((k) => k.p), true, 'centripetal');
  const tgtCurve = new THREE.CatmullRomCurve3(keys.map((k) => k.t), true, 'centripetal');
  posCurve.arcLengthDivisions = 2000;
  const tourLength = posCurve.getLength();
  const keyLengths = posCurve.getLengths(4000);
  const keyU = (i) => keyLengths[Math.round((i / keys.length) * 4000)] / tourLength;
  function sampleTour(u, outP, outT) {
    u = ((u % 1) + 1) % 1;
    posCurve.getPointAt(u, outP);
    const t = posCurve.getUtoTmapping(u);
    tgtCurve.getPoint(t, outT);
    const g = heightAt(outP.x, outP.z);
    if (outP.y < g + 8) outP.y = g + 8;
    if (outP.y < 6) outP.y = 6;

    const f = t * keys.length; const i = Math.round(f) % keys.length;
    return { key: keys[i].cap, near: 1 - Math.min(1, Math.abs(f - Math.round(f)) * 2) };
  }

  // ---------- per-frame update ----------
  function update(time, camera) {
    U.uTime.value = time;
    skyGroup.position.copy(camera.position);
    spawn.rotation.y = time * 0.006;
    spawn.position.y = 330 + Math.sin(time * 0.15) * 3;
  }
  function setFogDensity(d) { U.uFogDensity.value = d; scene.fog.density = d; }
  function setViewport(heightPx, fovDeg, pixelRatio) {
    U.uScale.value = (heightPx * pixelRatio) / (2 * Math.tan((fovDeg * Math.PI) / 360));
    skyGroup.userData.starMat.uniforms.uPix.value = pixelRatio;
  }

  return {
    scene, update, setViewport, setFogDensity, heightAt, sampleTour, keyU, tourLength, keys, landmarks, spawn,
    stats: { dist: distCount, buildings: S_BLD.m.length, lamps: lamps.length, trees: trees.length, roofs: roofs.length, walls: S_WALL.m.length },
  };
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}


const $ = (s) => document.querySelector(s);
const stage = $('#stage'), loader = $('#loader');

const ICON_EXPLORE = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.4 5.6 9 9 5.6 10.4 7 7z" fill="currentColor"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6L12.6 8z" fill="currentColor"/></svg>';

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;

function fail(msg) {

  loader.classList.remove('gone');
  loader.innerHTML = '<div><p>The gas would not light.</p><small>' + msg + '</small></div>';

function webglOK() {
  try {
    const c = document.createElement('canvas');
    return !!(c.getContext('webgl2') || c.getContext('webgl'));
  } catch (e) { return false; }
}

async function main() {
  if (!webglOK()) { fail('This page needs WebGL, which this browser or device has turned off.'); return; }
  await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 30)));

  const small = Math.min(innerWidth, innerHeight) < 600;
  const mobile = coarse || small;
  const maxPR = Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 2);
  let pr = maxPR;

  let renderer;

    renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', stencil: false });
  } catch (e) { fail('Could not start WebGL on this device.'); return; }

  stage.appendChild(renderer.domElement);
  renderer.domElement.tabIndex = 0;

  const world = buildWorld(THREE, {});

    const keep = new Set(cand.slice(0, MAXL));
    for (const l of L) {
      const o = keep.has(l) ? Math.round(l.vis * 20) / 20 : 0;
      if (o > 0) l.el.style.transform = `translate3d(${l.sx.toFixed(1)}px, ${l.sy.toFixed(1)}px, 0) translate(-50%, -100%)`;
      if (o !== l.o) { l.el.style.opacity = String(o); l.o = o; l.el.firstChild.tabIndex = o > 0.3 ? 0 : -1; }
    }
  }

  requestAnimationFrame(frame);

  // pause the clock while hidden so the tour doesn't jump
  document.addEventListener('visibilitychange', () => { if (!document.hidden) clock.getDelta(); });
  // keyboard: space toggles tour / explore
  addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); mode === 'tour' ? enterExplore() : resumeTour(); }
  });
  renderer.domElement.addEventListener('webglcontextlost', (e) => { e.preventDefault(); fail('The graphics context was lost. Reload the page to try again.'); });
}

main().catch((e) => { console.error(e); fail('Something went wrong while building the city.'); });
</script>
